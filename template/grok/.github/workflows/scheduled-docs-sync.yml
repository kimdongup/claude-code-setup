name: Scheduled - Documentation Sync

# 한 달에 한 번, 지난 기간의 코드 변경과 문서 변경을 비교해 어긋난 곳을 찾습니다.
#
# 비교와 판정까지는 셸로 끝납니다. 설명 문안만 필요할 때 모델을 씁니다 —
# 그리고 그건 선택 사항입니다(`XAI_API_KEY` 가 있을 때만).

on:
  schedule:
    - cron: '0 9 1 * *'   # 매월 1일 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: scheduled-docs-sync
  cancel-in-progress: true

jobs:
  drift:
    name: 문서 어긋남 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 기간 내 코드 변경 수집
        id: changes
        run: |
          SINCE=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
          git log --since="$SINCE" --name-only --pretty=format: \
            | grep -vE '^\s*$' \
            | grep -E '\.(ts|tsx|js|jsx|py|go|rs)$' \
            | grep -vE '(^|/)(test|tests|__tests__)/' \
            | sort -u > code-changed.txt || true
          echo "소스 변경 파일: $(wc -l < code-changed.txt | tr -d ' ')"
          echo "period_start=$SINCE" >> "$GITHUB_OUTPUT"

      - name: 코드만 바뀌고 문서는 그대로인 파일 찾기
        id: drift
        run: |
          : > drift.txt
          while read -r f; do
            [ -f "$f" ] || continue
            # 같은 경로에 README/문서 후보가 있는지
            dir=$(dirname "$f"); base=$(basename "$f")
            stem="${base%.*}"
            for cand in "$dir/README.md" "$dir/$stem.md" "$dir/docs/$stem.md" "docs/$stem.md"; do
              if [ -f "$cand" ]; then
                SINCE=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
                if ! git log --since="$SINCE" --name-only --pretty=format: -- "$cand" | grep -q .; then
                  echo "$f → $cand (코드만 변경됨)" >> drift.txt
                fi
                break
              fi
            done
          done < code-changed.txt
          echo "drift_count=$(wc -l < drift.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat drift.txt

      - name: 결과 요약
        run: |
          {
            echo "### 문서 동기화 점검"
            echo ""
            echo "- 기간 시작: ${{ steps.changes.outputs.period_start }}"
            echo "- 소스 변경 파일: $(wc -l < code-changed.txt | tr -d ' ')"
            echo "- 문서가 따라오지 못한 파일: **${{ steps.drift.outputs.drift_count }}**"
            echo ""
            if [ "${{ steps.drift.outputs.drift_count }}" -gt 0 ]; then
              echo '```'
              cat drift.txt
              echo '```'
            else
              echo "어긋난 문서를 찾지 못했습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Grok 으로 초안 생성 (선택)
        if: steps.drift.outputs.drift_count != '0' && secrets.XAI_API_KEY != ''
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          curl -fsSL -o grok.tgz https://grok.build/install.sh 2>/dev/null || true
          if [ ! -x ./grok ]; then
            echo "Grok Build 설치에 실패했습니다 — 게이트 결과만 반영합니다."
            exit 0
          fi
          chmod +x ./grok
          {
            echo "다음 파일들의 문서를 갱신할 초안을 한국어로 작성하세요."
            echo "문서 형식은 기존 것을 유지하고, 사실이 아닌 내용을 지어내지 마세요."
            echo ""
            cat drift.txt
          } > prompt.txt
          ./grok --trust -p "$(cat prompt.txt)" > docs-draft.md || true
          echo "초안 생성 완료 — $(wc -l < docs-draft.md) 줄"
          continue-on-error: true